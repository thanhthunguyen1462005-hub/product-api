services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: product-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb
    healthcheck:
      test: wget -qO- http://localhost:3000/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data: