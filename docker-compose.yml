services:
  mongodb:
    image: mongo:6.0
    container_name: compose-mongodb
    restart: always
    ports:
      - "27017:27017"

  api:
    build: .
    container_name: compose-product-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb