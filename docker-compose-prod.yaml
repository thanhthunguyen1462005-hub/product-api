services:
  nammongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=productdb
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-prod-net

  product-api:
    image: ${DOCKER_IMAGE:-thanhthunguyen1462005/product-api:latest}
    container_name: product-api-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://nammongodb:27017/productdb
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - product-prod-net

networks:
  product-prod-net:
    driver: bridge

volumes:
  mongo-prod-data:
    driver: local
