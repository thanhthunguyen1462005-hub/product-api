name: Simple CI Pipeline Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-simple-ci:
    name: Run Simple CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Verify Syntax & Project Files
        run: |
          node -c server.js
          node -c src/app.js
          node -c src/models/Product.js
          node -c src/routes/productRoutes.js
          node -c src/routes/healthRoutes.js
          echo "All source files passed syntax verification!"

      - name: 5. Test Summary
        run: |
          echo "Simple CI Pipeline completed successfully!"
