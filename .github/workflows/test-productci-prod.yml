name: Production CI Test with MongoDB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB via Docker
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0
          sleep 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/productdb_test
        run: npm test